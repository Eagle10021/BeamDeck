# BeamDeck multiplayer: the relay passes each player's car music to the others (beamdeck-relay.py), and the freight hub
# (freight-hub.py) shares freight jobs, convoys, chat and the Windows app's updates. Both are bound to the Tailscale address
# only (set RELAY_BIND to this machine's Tailscale address), like the BeamMP server is reached.
services:
  beamdeck-relay:
    image: python:3.12-alpine
    container_name: beamdeck-relay
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./beamdeck-relay.py:/app/beamdeck-relay.py:ro
    command: ["python3", "-u", "beamdeck-relay.py"]
    environment:
      - BEAMDECK_RELAY_PORT=47140
    ports:
      - "${RELAY_BIND:-0.0.0.0}:47140:47140"

  freight-hub:
    image: python:3.12-alpine
    container_name: beamdeck-freight-hub
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./freight-hub.py:/app/freight-hub.py:ro
      - ./hub-data:/data
    command: ["python3", "-u", "freight-hub.py"]
    environment:
      - BEAMDECK_HUB_PORT=47141
      - BEAMDECK_HUB_DATA=/data
    ports:
      - "${RELAY_BIND:-0.0.0.0}:47141:47141"
