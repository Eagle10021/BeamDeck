<!doctype html>
<!-- BeamDeck TV, idle: shown on the TV's screen panel until BeamDeck's car screens are on (then it shows car.html) -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; height: 100%; background: #050607; overflow: hidden; }
  .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
       font: 600 34px/1.2 system-ui, sans-serif; color: #3a4148; letter-spacing: .08em; }
  .c small { font-size: 20px; font-weight: 500; margin-top: 10px; color: #2a3036; letter-spacing: .02em; }
  .scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 2px, transparent 2px 4px); }
</style></head><body>
  <div class="c">BEAMDECK<small>No signal: turn on Car screens in BeamDeck</small></div><div class="scan"></div>
</body></html>
