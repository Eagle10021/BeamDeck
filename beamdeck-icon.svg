<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa463"/>
      <stop offset="1" stop-color="#d9662a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2430"/>
      <stop offset="1" stop-color="#0e1116"/>
    </linearGradient>
    <clipPath id="tileClip"><rect x="12" y="12" width="232" height="232" rx="52"/></clipPath>
  </defs>
  <!-- tile -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bg)"/>
  <!-- dashboard curve -->
  <path d="M0 200 Q128 150 256 200 L256 256 L0 256 Z" fill="#0e1116" opacity="0.28" clip-path="url(#tileClip)"/>
  <!-- in-car screen -->
  <rect x="44" y="58" width="168" height="112" rx="16" fill="url(#screen)" stroke="#0e1116" stroke-width="6"/>
  <rect x="54" y="68" width="148" height="92" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <!-- play button -->
  <path d="M112 88 L112 140 L152 114 Z" fill="#ffffff" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
  <!-- screen mount -->
  <rect x="112" y="170" width="32" height="14" rx="4" fill="#0e1116"/>
  <!-- sound waves (the car audio) -->
  <path d="M190 194 q10 10 0 20" fill="none" stroke="#0e1116" stroke-width="7" stroke-linecap="round"/>
  <path d="M204 186 q18 18 0 36" fill="none" stroke="#0e1116" stroke-width="7" stroke-linecap="round"/>
  <path d="M66 194 q-10 10 0 20" fill="none" stroke="#0e1116" stroke-width="7" stroke-linecap="round"/>
  <path d="M52 186 q-18 18 0 36" fill="none" stroke="#0e1116" stroke-width="7" stroke-linecap="round"/>
</svg>
